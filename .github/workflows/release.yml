name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs build the binaries as workflow artifacts without creating a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      - name: Check that the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(uv run --frozen python -c 'import keep_cli; print(keep_cli.__version__)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match keep_cli.__version__ (${version})"
            exit 1
          fi

  build:
    name: Build ${{ matrix.arch }} binary
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64 # Raspberry Pi 4/5 with a 64-bit OS
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - arch: armv7 # Raspberry Pi with a 32-bit OS; emulated with QEMU, so this job is slow
            runner: ubuntu-24.04
            platform: linux/arm/v7
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        if: matrix.arch == 'armv7'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      # Debian bullseye ships glibc 2.31, so the binaries run on Debian 11+, Ubuntu 20.04+
      # and Raspberry Pi OS Bullseye or newer. gcc/zlib are needed on armv7, where
      # pyinstaller and pycryptodomex have no prebuilt wheels and compile from source.
      - name: Build binary in Debian bullseye container
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            --volume "${PWD}:/src" --workdir /src \
            --env UV_LINK_MODE=copy \
            python:3.12-slim-bullseye bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                binutils gcc libc6-dev zlib1g-dev git ca-certificates
              pip install --no-cache-dir uv
              ./scripts/build-binary.sh
            '
      - name: Verify binary
        run: |
          ls -la dist
          test -x "dist/keep-linux-${{ matrix.arch }}"
          (cd dist && sha256sum -c "keep-linux-${{ matrix.arch }}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: keep-linux-${{ matrix.arch }}
          path: dist/keep-linux-${{ matrix.arch }}*
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        run: |
          ls -la dist
          cat dist/*.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
